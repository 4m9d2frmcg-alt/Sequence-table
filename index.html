  line-height:22px!important;
}

/* 왼쪽 탐색 목록: 현재 경로(의뢰사·제품·시험법)에 그 의뢰사 대표색, 얇은 1px 테두리 (2026-11-12) */

/* 노트·댓글 확인 상태: 제목 굵기·색은 그대로 두고 제목 뒤 작은 표시로 알린다(2026-11-12) */

.review-badge {
  display:inline-flex;
  align-items:center;
  gap:.25em;
  box-sizing:border-box;
  height:1.75em;
  padding:0 .6em 0 .45em;
  margin-left:.45em;
  border:1px solid;
  border-radius:999px;
  font-size:.7em;
  font-weight:var(--fw-medium);
  line-height:1;
  letter-spacing:0;
  white-space:nowrap;
  vertical-align:.02em;
}

.review-badge svg {
  width:1em;
  height:1em;
  flex:none;
}

.review-badge.is-verified {
  background:var(--c-success-soft);
  border-color:var(--c-success-line);
  color:var(--c-success);
}

.review-badge.is-rejected {
  background:var(--c-card);
  border-color:var(--c-danger-line);
  color:var(--c-danger);
}

body.dark .review-badge.is-verified {
  background:var(--c-success-soft);
  border-color:var(--c-success-line);
  color:var(--c-success);
}

body.dark .review-badge.is-rejected {
  background:var(--c-warning-soft);
  border-color:var(--c-danger-line);
  color:var(--c-warning);
}

.comment-text .review-badge {
  font-size:.8em;
}

/* 메인 선택 화면: 세 칸 모두 공통 선택 배경과 테두리를 사용한다. */

body #landing .choice[data-client] {
  padding-left:var(--sp-24)!important;
}

/* 이미 고른 의뢰사·제품 이름은 줄마다 되풀이하지 않는다(전체 보기에서는 표시). */

body #landing.has-client [data-sample] .catalog-parent,
body #landing.has-sample [data-test] .catalog-parent {
  display:none;
}

/* 내 정보: 로그인 유지·알림 받지 않기 */

body #profileBody .profile-form label.profile-check {
  display:flex!important;
  flex-direction:row!important;
  align-items:center!important;
  justify-content:flex-start!important;
  gap:var(--sp-8)!important;
  font-weight:var(--fw-regular);
  margin:0 0 var(--sp-10);
}

body #profileBody .profile-form label.profile-check input[type=checkbox] {
  flex:0 0 18px!important;
  width:18px!important;
  min-width:18px!important;
  max-width:18px!important;
  height:18px!important;
  min-height:18px!important;
  max-height:18px!important;
  margin:0!important;
  padding:0!important;
}

/* 시험법 '분석 일정표' (src/11-run-plan.js) */

.run-plan {
  container-type:inline-size;
  --run-row:36px;
}

.run-body {
  display:grid;
  gap:var(--sp-20);
}

@container (min-width:1000px) {
  .run-body {
    grid-template-columns:minmax(0,1fr) 440px;
    align-items:start;
  }
}

.run-main {
  min-width:0;
}

.run-plan h2 {
  margin:0;
}

.run-plan-head {
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:var(--sp-12);
  flex-wrap:wrap;
  margin-bottom:var(--sp-14);
}

.run-start {
  display:flex;
  gap:var(--sp-10);
}

.run-start label,
.run-method-fields label {
  display:grid;
  gap:var(--sp-6);
  min-width:0;
  color:var(--c-text-sub);
}

.run-method-fields input {
  width:100%;
}

.run-toolbar {
  display:flex;
  gap:var(--sp-8);
  flex-wrap:wrap;
  margin-bottom:var(--sp-10);
}

.run-spacer {
  flex:1;
}

/* 시트: 얇은 칸 경계, 숫자는 오른쪽·고정폭 숫자, 계산 칸은 회색, 포커스는 파란 테두리 */

.run-sheet,
.run-grid-wrap {
  overflow-x:auto;
  border:1px solid var(--c-line);
  border-radius:var(--r-md);
  background:var(--c-card);
}

.run-table,
.run-grad {
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  font-variant-numeric:tabular-nums;
}

.run-table {
  min-width:640px;
  table-layout:fixed;
}

.run-table .c-n {
  width:52px;
}

.run-table .c-check {
  width:48px;
}

.run-table .c-name {
  width:18%;
}

.run-table .c-method {
  width:14%;
}

.run-table .c-vol {
  width:92px;
}

.run-table .c-time {
  width:64px;
}

.run-table .c-del {
  width:32px;
}

.run-table th {
  padding:0 var(--sp-10);
}

.run-table th,
.run-grad th {
  font-weight:var(--fw-medium);
  color:var(--c-text-sub);
  background:var(--c-block);
  border-bottom:1px solid var(--c-line);
}

.run-table th {
  white-space:nowrap;
}

.run-table th+th,
.run-grad th+th,
.run-table td+td,
.run-grad td+td {
  border-left:1px solid var(--c-line);
}

.run-grad th:first-child,
.run-table th:first-child {
  border-left-color:transparent;
}

.run-table td,
.run-grad td {
  padding:0;
  border-bottom:1px solid var(--c-line);
  vertical-align:middle;
}

.run-table tbody tr:last-child td,
.run-grad tbody tr:last-child td {
  border-bottom:0;
}

.run-table tbody tr:hover td,
.run-grad tbody tr:hover td {
  background:var(--c-hover);
}

.run-table tr.is-focused td {
  background:var(--c-selected);
}

.run-cell input {
  display:block;
  width:100%;
  height:var(--run-row);
  min-height:0;
  box-sizing:border-box;
  margin:0;
  padding:0 var(--sp-10);
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
  color:var(--c-text);
  font:inherit;
}

.run-cell input:focus {
  outline:0;
  background:var(--c-card);
  box-shadow:inset 0 0 0 2px var(--c-primary);
}

.run-cell.is-unknown input {
  color:var(--c-danger);
}

.run-n,
.run-check {
  text-align:center;
  color:var(--c-text-sub);
  white-space:nowrap;
}

.run-check input {
  width:16px;
  height:16px;
  margin:0;
  accent-color:var(--c-primary);
}

.run-calc {
  padding:0 var(--sp-10)!important;
  color:var(--c-text-sub);
  background:var(--c-block);
  white-space:nowrap;
}

.run-del {
  text-align:center;
}

.run-icon {
  width:24px;
  height:24px;
  min-height:0;
  padding:0;
  border:0;
  border-radius:var(--r-sm);
  background:transparent;
  color:var(--c-text-sub);
  font-size:var(--fs-reading);
  line-height:1;
  opacity:0;
  cursor:pointer;
}

tr:hover .run-icon,
.run-icon:focus-visible {
  opacity:1;
}

.run-icon:hover {
  background:var(--c-block);
  color:var(--c-text);
}

.run-note {
  margin:var(--sp-8) 0 0;
  color:var(--c-text-sub);
}

.run-side {
  display:grid;
  gap:var(--sp-14);
  margin-top:var(--run-side-offset,0px);
}

.run-card {
  padding:var(--sp-16);
  border:1px solid var(--c-line);
  border-radius:var(--r-md);
  background:var(--c-card);
}

.run-card h3 {
  margin:0 0 var(--sp-12);
  font-size:var(--fs-card-title);
  font-weight:var(--fw-strong);
}

.run-method-tabs {
  display:flex;
  gap:var(--sp-4);
  margin-bottom:var(--sp-14);
  border:1px solid var(--c-line);
  border-radius:var(--r-md);
  background:var(--c-block);
}

.run-method-tabs button {
  min-height:0;
  padding:0 var(--sp-12);
  border:1px solid transparent;
  border-radius:var(--r-sm);
  background:transparent;
  box-shadow:none;
  color:var(--c-text-sub);
  font-weight:var(--fw-medium);
}

.run-method-tabs button.is-active {
  background:var(--c-card);
  border-color:var(--c-line);
  color:var(--c-text);
}

.run-method-tabs .run-method-add {
  color:var(--c-primary-text);
}

.run-method-fields {
  display:grid;
  gap:var(--sp-10);
  margin-bottom:var(--sp-14);
}

.run-grad {
  min-width:0;
}

.run-method-foot {
  display:flex;
  justify-content:space-between;
  margin-top:var(--sp-8);
}

.run-link {
  height:auto;
  min-height:0;
  padding:var(--sp-4) var(--sp-2);
  border:0;
  background:transparent;
  box-shadow:none;
  color:var(--c-primary-text);
  font-size:var(--fs-caption);
  font-weight:var(--fw-medium);
}

.run-link.is-danger {
  color:var(--c-text-sub);
}

.run-link:hover {
  text-decoration:underline;
}

.run-channels {
  margin-top:var(--sp-16);
  padding-top:var(--sp-14);
  border-top:1px solid var(--c-line);
}

.run-channels-title {
  margin:0 0 var(--sp-8);
  color:var(--c-text-sub);
}

.run-channels>div {
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:var(--sp-6);
}

.run-channels>div>div {
  padding:var(--sp-8) var(--sp-10);
  border-radius:var(--r-md);
  background:var(--c-block);
}

.run-channels span {
  display:block;
  color:var(--c-text-sub);
}

.run-channels b {
  font-weight:var(--fw-strong);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}

.run-kv {
  display:grid;
  grid-template-columns:1fr auto;
  gap:var(--sp-8) var(--sp-12);
  margin:0;
}

.run-kv dt {
  color:var(--c-text);
  font-weight:var(--fw-strong);
}

.run-kv dd {
  margin:0;
  font-weight:var(--fw-regular);
  text-align:right;
  font-variant-numeric:tabular-nums;
}

.run-sst {
  display:grid;
  gap:var(--sp-8);
  margin:0;
  padding:0;
  list-style:none;
}

.run-sst li {
  display:flex;
  justify-content:flex-start;
  gap:var(--sp-12);
}

.run-sst b {
  color:var(--c-text);
  font-weight:var(--fw-strong);
  white-space:nowrap;
  font-variant-numeric:tabular-nums;
}

.run-body {
  padding-right:var(--sp-28);
}

.run-start input,
.run-method-fields input {
  height:36px;
  min-height:0;
  box-sizing:border-box;
  padding:0 var(--sp-10);
  border:1px solid var(--c-line);
  border-radius:var(--r-md);
  background:var(--c-card);
  box-shadow:none;
  color:var(--c-text);
  font:inherit;
}

.run-start input:focus,
.run-method-fields input:focus {
  outline:0;
  border-color:var(--c-primary);
  box-shadow:0 0 0 3px var(--c-primary-soft);
}

.all-note-entry.is-expanded .all-note-detail {
  cursor:pointer;
}

/* 분석 일정: Method 이름 목록 창(공통 .app-select-options 모양) */

.run-pop {
  z-index:200;
  max-height:none;
}

.run-method-pop {
  max-height:240px;
}

.run-start input {
  width:140px;
  cursor:pointer;
}

.run-name-line {
  display:flex;
  align-items:center;
  gap:var(--sp-8);
}

.run-name-line input {
  flex:1;
}

.run-note-top {
  margin:0 0 var(--sp-8);
}

.run-grad tr.is-invalid input {
  color:var(--c-danger);
}

.run-method-foot {
  align-items:center;
}

#runPlanBtn.is-active {
  background:var(--c-primary-soft);
  border-color:var(--c-line-strong);
  color:var(--c-primary-text);
}

/* 분석 일정표 정렬: #·SST·주입·종료만 가운데, 나머지는 왼쪽. SST 체크 행은 굵은 글씨, 날짜가 바뀌면 하루 건너 진한 회색. */

.run-table th,
.run-grad th {
  text-align:left;
}

.run-table th:nth-child(2),
.run-table th:nth-child(3),
.run-table th:nth-child(10),
.run-table th:nth-child(11),
.run-calc {
  text-align:center;
}

/* SST 체크 행: 배경 없이 굵은 글씨만 */

.run-table tbody tr.is-checked td,
.run-table tbody tr.is-checked td input {
  font-weight:var(--fw-strong);
}

.run-calc.is-alt-day {
  background:var(--c-band);
}

.run-table tr.is-checked td.run-check {
  box-shadow:none;
}

/* 분석 일정표 크기 통일: 조작·입력 36px, 내용 14px(--fs-body), 제목·안내 12px(--fs-caption) */

.run-plan {
  font-size:var(--fs-body);
}

.run-table,
.run-grad,
.run-kv,
.run-sst,
.run-cell input,
.run-start input,
.run-method-fields input,
.run-pop {
  font-size:var(--fs-body);
}

.run-table th,
.run-grad th,
.run-start label,
.run-method-fields label,
.run-note,
.run-channels-title,
.run-channels span {
  font-size:var(--fs-caption);
}

.run-table th,
.run-grad th,
.run-table td,
.run-grad td {
  height:var(--h-input);
}

.run-method-tabs {
  box-sizing:border-box;
  min-height:var(--h-control);
  padding:var(--sp-2);
  flex-wrap:wrap;
  overflow:visible;
}

.run-method-tabs button {
  height:var(--h-control-sm);
  font-size:var(--fs-body);
}

.run-channels b {
  font-size:var(--fs-body);
}

.run-memo-head {
  padding:0!important;
}

.run-memo-head input {
  display:block;
  width:100%;
  height:var(--h-input);
  min-height:0;
  box-sizing:border-box;
  margin:0;
  padding:0 var(--sp-10);
  border:0;
  border-radius:0;
  background:transparent;
  box-shadow:none;
  color:var(--c-text-sub);
  font:inherit;
  font-size:var(--fs-caption);
  font-weight:var(--fw-medium);
  text-decoration:underline dotted var(--c-line-strong);
  text-underline-offset:4px;
}

.run-memo-head input:focus {
  outline:0;
  background:var(--c-card);
  box-shadow:inset 0 0 0 2px var(--c-primary);
  text-decoration:none;
}

.run-save {
  display:flex;
  align-items:center;
  gap:var(--sp-8);
}

/* 저장 버튼 오른쪽에 저장 위치·변경 안내를 두 줄로 */

.run-save small {
  font-size:var(--fs-caption);
  color:var(--c-text-sub);
  white-space:nowrap;
}

.run-toolbar {
  align-items:flex-end;
}

.run-card h4 {
  margin:var(--sp-16) 0 var(--sp-8);
  padding-top:var(--sp-14);
  border-top:1px solid var(--c-line);
  font-size:var(--fs-body);
  font-weight:var(--fw-strong);
}

.run-grad {
  table-layout:fixed;
}

.run-grad .run-cell input {
  padding:0 var(--sp-8);
}

.run-grad th {
  padding:var(--sp-4) var(--sp-8);
  line-height:1.3;
}

/* 지금 시각: 표 위에 떠 있는 주황색 2px 줄(11-run-plan.js가 위치를 정함) */

.run-sheet {
  position:relative;
}

.run-now-line {
  position:absolute;
  top:-1px;
  left:0;
  z-index:3;
  height:2px;
  background:var(--c-now);
  pointer-events:none;
  will-change:transform;
}

@media(prefers-reduced-motion:reduce) {
  .run-now-line {
    transition:none;
  }
}

.run-table tbody tr.is-now td.run-n {
  color:var(--c-now);
  font-weight:var(--fw-strong);
}

/* Method 기울기 그래프 */

.run-graph {
  margin:var(--sp-12) 0 0;
}

.run-graph svg {
  display:block;
  width:100%;
  height:auto;
  overflow:visible;
}

.run-graph text {
  fill:var(--c-text-sub);
  font-size:var(--fs-tiny);
  font-variant-numeric:tabular-nums;
}

.run-graph-grid {
  stroke:var(--c-line);
  stroke-width:1;
}

.run-graph-line {
  fill:none;
  stroke-width:2;
  stroke-linejoin:round;
  stroke-linecap:round;
}

.run-graph-line.run-graph-a {
  stroke:var(--c-chart-a);
}

.run-graph-line.run-graph-b {
  stroke:var(--c-chart-b);
}

.run-graph-line.run-graph-c {
  stroke:var(--c-chart-c);
}

.run-graph-line.run-graph-d {
  stroke:var(--c-chart-d);
}

.run-graph figcaption {
  display:flex;
  gap:var(--sp-12);
  margin-top:var(--sp-4);
  font-size:var(--fs-caption);
  color:var(--c-text-sub);
}

.run-graph-key::before {
  content:"";
  display:inline-block;
  width:14px;
  height:2px;
  margin-right:var(--sp-4);
  vertical-align:middle;
  background:currentColor;
}

.run-graph-key.run-graph-a {
  color:var(--c-chart-a);
}

.run-graph-key.run-graph-b {
  color:var(--c-chart-b);
}

.run-graph-key.run-graph-c {
  color:var(--c-chart-c);
}

.run-graph-key.run-graph-d {
  color:var(--c-chart-d);
}

/* 이미 끝난 주입: 현재 시각 줄 위쪽을 얇은 회색 유리로 덮는다 */

.run-past {
  position:absolute;
  left:0;
  z-index:2;
  height:0;
  background:var(--c-past);
  backdrop-filter:saturate(.4);
  -webkit-backdrop-filter:saturate(.4);
  pointer-events:none;
  transition:height var(--t-slow) var(--ease);
}

@media(prefers-reduced-motion:reduce) {
  .run-past {
    transition:none;
  }
}

/* Waters / Agilent 선택 */

.run-vendor {
  display:flex;
  gap:var(--sp-4);
  box-sizing:border-box;
  height:var(--h-control);
  padding:var(--sp-2);
  border:1px solid var(--c-line);
  border-radius:var(--r-md);
  background:var(--c-block);
}

.run-vendor button {
  flex:1;
  height:var(--h-control-sm);
  min-height:0;
  padding:0 var(--sp-12);
  border:1px solid transparent;
  border-radius:var(--r-sm);
  background:transparent;
  box-shadow:none;
  color:var(--c-text-sub);
  font-size:var(--fs-body);
  font-weight:var(--fw-medium);
}

.run-vendor button.is-active {
  color:var(--c-text);
}

/* 기울기 표: Waters(Curve 칸 포함)에서도 100이 잘리지 않게 여백을 줄이고 칸을 나눈다 */

.run-grad th,
.run-grad .run-cell input {
  padding-left:var(--sp-6);
  padding-right:var(--sp-4);
}

.run-grad th {
  overflow-wrap:normal;
  word-break:keep-all;
}

/* Waters curve 설명 */

.run-curve-help {
  margin-top:var(--sp-14);
  padding-top:var(--sp-12);
  border-top:1px solid var(--c-line);
  font-size:var(--fs-caption);
  color:var(--c-text-sub);
}

.run-curve-help summary {
  cursor:pointer;
  color:var(--c-text);
  font-weight:var(--fw-medium);
}

.run-curve-help p {
  margin:var(--sp-8) 0;
  line-height:1.6;
}

.run-curve-help dl {
  display:grid;
  grid-template-columns:44px 1fr;
  gap:var(--sp-4) var(--sp-8);
  margin:0;
}

.run-curve-help dt {
  font-weight:var(--fw-strong);
  color:var(--c-text);
  font-variant-numeric:tabular-nums;
}

.run-curve-help dd {
  margin:0;
}

/* 오른쪽 칸 440px: 기울기 표 제목·100이 한 줄에 들어간다 */

.run-grad th {
  white-space:nowrap;
}

.run-grad th:nth-child(2) {
  width:18%;
}

.run-grad th:nth-child(3) {
  width:23%;
}

/* Agilent / Waters 선택 표시가 미끄러지듯 이동 */

.run-vendor {
  position:relative;
  isolation:isolate;
}

.run-vendor-indicator {
  position:absolute;
  top:2px;
  bottom:2px;
  left:2px;
  z-index:-1;
  width:calc(50% - 4px);
  border:1px solid var(--c-line);
  border-radius:var(--r-sm);
  background:var(--c-card);
  transition:transform var(--t-slow) var(--ease);
}

.run-vendor[data-pos=waters] .run-vendor-indicator {
  transform:translateX(calc(100% + 4px));
}

.run-vendor button.is-active {
  background:transparent;
  border-color:transparent;
}

/* 그래프: 0분 → 끝으로 1초 동안 그려진다 */

.run-graph-reveal {
  transform-box:fill-box;
  transform-origin:left center;
  animation:run-graph-reveal 1000ms var(--ease) both;
}

@keyframes run-graph-reveal {
from {
    transform:scaleX(0);
  }

  to {
    transform:scaleX(1);
  }
}

@media(prefers-reduced-motion:reduce) {
  .run-vendor-indicator {
    transition:none;
  }

  .run-graph-reveal {
    animation:none;
  }
}

/* 분석 일정 버튼: 계산기 아이콘(정사각 36px) */

#runPlanBtn.run-plan-btn {
  width:var(--h-control);
  padding:0;
  display:inline-grid;
  place-items:center;
}

/* 요약 + SST 확인 시간: 표 위 한 블록 */

.run-summary-bar {
  display:grid;
  grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);
  gap:0;
  margin-bottom:var(--sp-14);
  border:1px solid var(--c-line);
  border-radius:var(--r-md);
  background:var(--c-card);
}

.run-summary-bar>* {
  padding:var(--sp-14) var(--sp-16);
}

.run-summary-bar .run-kv {
  grid-template-columns:repeat(2,auto minmax(0,1fr));
  column-gap:var(--sp-14);
}

.run-summary-bar .run-kv dd {
  text-align:left;
  white-space:nowrap;
}

.run-sst-box {
  border-left:1px solid var(--c-line);
}

/* 주요 확인 시간: 최대 4줄 높이로 고정, 넘치면 이 칸 안에서만 스크롤(아래 표가 밀리지 않게) */
.run-sst-box [data-run-sst] {
  max-height:calc(4 * 1.6em + 3 * 8px);
  overflow-y:auto;
  overscroll-behavior:contain;
  scrollbar-width:thin;
}

.run-sst-box h4 {
  margin:0 0 var(--sp-8);
  padding:0;
  border:0;
  font-size:var(--fs-card-title);
  font-weight:var(--fw-strong);
}

@media(max-width:900px) {
  .run-summary-bar {
    grid-template-columns:minmax(0,1fr);
  }

  .run-sst-box {
    border-left:0;
    border-top:1px solid var(--c-line);
  }
}

/* 제목 옆 최근 수정, 저장 아래 안내 */

.run-title {
  display:flex;
  align-items:baseline;
  gap:var(--sp-12);
  flex-wrap:wrap;
}

.run-meta {
  font-size:var(--fs-caption);
  color:var(--c-text-sub);
}

/* 이동상 총 사용량: 그래프 선 색을 글자색으로 */

.run-channels .run-graph-key::before {
  display:none;
}

.run-graph-unit {
  fill:var(--c-text-sub);
  font-weight:var(--fw-medium);
}

/* 빨간 선 표시표: 맨 왼쪽에 평소 NOW, 마우스를 올리면 현재 시각, 끄는 동안 새빨간 예상 시각 */

.run-now-time {
  position:absolute;
  left:0;
  top:50%;
  transform:translateY(-50%);
  padding:1px var(--sp-8);
  border-radius:var(--r-xs);
  background:var(--c-now);
  color:var(--c-on-primary);
  font-size:var(--fs-tiny);
  font-weight:var(--fw-strong);
  letter-spacing:.02em;
  line-height:16px;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  pointer-events:auto;
  cursor:ns-resize;
  user-select:none;
  transition:background-color var(--t-fast) var(--ease);
}

/* 선을 잡는 투명한 띠(선 위아래 6px) */

.run-now-grip {
  position:absolute;
  left:0;
  right:0;
  top:-6px;
  height:14px;
  pointer-events:auto;
  cursor:ns-resize;
}

.run-now-line {
  transition:transform var(--t-slow) var(--ease),background-color var(--t-fast) var(--ease);
}

.run-now-line.is-drag {
  height:3px;
  background:var(--c-now-strong);
  box-shadow:0 0 0 1px color-mix(in srgb,var(--c-now-strong) 25%,transparent);
}

.run-now-line.is-drag .run-now-time {
  background:var(--c-now-strong);
  font-size:var(--fs-caption);
}

.run-grad .run-del-head,
.run-grad td.run-del {
  width:30px;
}

/* curve 도움말: (?) 아이콘, 출처 링크 */

.run-help-icon {
  display:inline-grid;
  place-items:center;
  width:14px;
  height:14px;
  margin-left:var(--sp-4);
  border:1px solid var(--c-line-strong);
  border-radius:50%;
  font-size:var(--fs-tiny);
  line-height:1;
  color:var(--c-text-sub);
  vertical-align:1px;
}

.run-help-links {
  display:flex;
  flex-wrap:wrap;
  gap:var(--sp-6) var(--sp-14);
}

.run-help-links a {
  color:var(--c-primary-text);
  font-weight:var(--fw-medium);
}

.run-grad td.is-bad input {
  color:var(--c-danger);
  background:var(--c-danger-soft);
}

/* 기울기 표 위 행 추가 */

.run-grad-tools {
  display:flex;
  justify-content:flex-start;
  margin-bottom:var(--sp-6);
}

/* 칸 여는 화살표·맨 위로 버튼: 열림/닫힘 모두 흰 버튼, 평소 50% → 마우스·키보드 초점에서 100%, 마우스를 올리면 어떤 칸인지 말풍선 */

body :is(#toggleLeftPanel,#toggleRightPanel,#toggleJournalPane),
body #toggleJournalPane[aria-expanded=true],
body :is(#toggleLeftPanel,#toggleRightPanel,#toggleJournalPane)[aria-expanded=true] {
  background:var(--c-card);
  border-color:var(--c-line);
}

body :is(#toggleLeftPanel,#toggleRightPanel,#toggleJournalPane),
body .scroll-top-button {
  opacity:.5;
  transition:opacity var(--t-fast) var(--ease),left var(--t-slow) var(--ease),right var(--t-slow) var(--ease),background-color var(--t-fast) var(--ease)!important;
}

body :is(#toggleLeftPanel,#toggleRightPanel,#toggleJournalPane):is(:hover,:focus-visible),
body .scroll-top-button:is(:hover,:focus-visible) {
  opacity:1;
}

body :is(#toggleLeftPanel,#toggleRightPanel,#toggleJournalPane)[data-tip]::after {
  content:attr(data-tip);
  position:absolute;
  top:50%;
  right:calc(100% + 8px);
  padding:var(--sp-4) var(--sp-8);
  border-radius:var(--r-sm);
  background:var(--c-text);
  color:var(--c-card);
  font-size:var(--fs-caption);
  font-weight:var(--fw-medium);
  line-height:1.5;
  white-space:nowrap;
  pointer-events:none;
  opacity:0;
  transform:translateY(-50%);
  transition:opacity var(--t-fast) var(--ease);
}

body #toggleLeftPanel[data-tip]::after {
  right:auto;
  left:calc(100% + 8px);
}

body :is(#toggleLeftPanel,#toggleRightPanel,#toggleJournalPane):is(:hover,:focus-visible)::after {
  opacity:1;
}

.run-start {
  align-items:flex-end;
}

/* 시작 날짜·시간·[현재 시각]은 Fill down 줄 오른쪽 끝, 버튼 아래선에 맞춘다 */

.run-toolbar>.run-start {
  margin-left:auto;
}

/* 시간 칸은 HH:MM만 들어가므로 좁게 */

.run-toolbar .run-start input[data-plan-field=time] {

/* 이전으로·앞으로: 아이콘 버튼 */

  place-items:center;
  width:36px;
  padding:0;

/* 도구 줄 버튼은 저장 버튼·날짜 칸과 같은 36px */

.run-toolbar .btn {
  height:var(--h-control);
  min-height:0;
  padding-top:0;
  padding-bottom:0;
}

.run-toolbar>.run-undo:disabled {
  opacity:.4;
  cursor:default;

/* [현재 시각]은 날짜·시간 입력칸과 같은 36px 높이 */

.run-start>[data-run-now] {
  height:36px;
  min-height:0;
  padding-top:0;
  padding-bottom:0;
  white-space:nowrap;

/* 좁은 화면(노트북)에서는 번호·체크·주입량 칸을 줄여 표 끝(종료)까지 들어가게 */

    width:44px;

    width:40px;
  }

  color:var(--c-text);

  gap:var(--sp-6);

  width:46px;
}

.run-table .run-eq-name>span {
  color:var(--c-text);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

.run-curve-figure {
  margin:var(--sp-12) 0 0;
}

.run-curve-figure img {
  display:block;
  width:100%;
  height:auto;
  border:1px solid var(--c-line);
  border-radius:var(--r-sm);
  background:var(--c-paper);
}

.run-curve-figure figcaption {
  margin-top:var(--sp-6);
  font-size:var(--fs-caption);
  color:var(--c-text-sub);
}

/* 계산 화면 도구 줄: 왼쪽 표 편집(행 추가·EQ·Fill down | 되돌리기 | 전체 비우기), 오른쪽 시작(날짜·시간·현재 시각) | 저장. 모든 칸·버튼 36px 한 줄 */

  align-items:center;
  gap:var(--sp-8) var(--sp-16);

.run-plan .run-toolbar>.run-start,
.run-plan .run-toolbar>.run-save {

  align-items:center;
  gap:var(--sp-6);

.run-plan .run-toolbar>.run-start {

}

.run-start-label {

  font-size:var(--fs-small);
  white-space:nowrap;

.run-plan .run-toolbar .run-start input {
  height:36px;

/* 열람 전용 자료(시험일지·SOP)는 인쇄하지 않는다 */

  .journal-pane,
  .restricted-reader {
    visibility:hidden!important;
  }

<script>/* Shared motion timing: CSS tokens are authoritative in both apps and standalone HTML. */
(()=>{
 const defaults={fast:180,base:280,slow:420};
 const reduced=()=>matchMedia('(prefers-reduced-motion: reduce)').matches||document.documentElement.classList.contains('no-motion');
 function timing(kind='base'){
  const style=getComputedStyle(document.documentElement),raw=style.getPropertyValue('--t-'+kind).trim(),number=parseFloat(raw),duration=Number.isFinite(number)?number*(raw.endsWith('ms')?1:1000):(defaults[kind]||defaults.base);
  return {duration:reduced()?0:duration,easing:style.getPropertyValue('--ease').trim()||'cubic-bezier(.22,1,.36,1)'};
 }
 /* --ease(cubic-bezier(.22,1,.36,1))와 같은 모양의 진행 곡선(빠르게 다가가 끝에서 길게 멈춤, 반동 없음). 스크롤처럼 직접 그리는 움직임에 쓴다. */
 function ease(t){t=Math.min(1,Math.max(0,t));return 1-Math.pow(1-t,5)}
 /* 창 스크롤을 공통 곡선·느림(420ms)으로 to까지 옮긴다. 끝나면 done 호출. */
 let scrollFrame=0;
 function scrollTo(to,done){cancelAnimationFrame(scrollFrame);const from=scrollY,{duration}=timing('slow');if(!duration||Math.abs(from-to)<1){window.scrollTo(0,to);done?.();return}const start=performance.now();(function tick(now){const t=Math.min(1,(now-start)/duration);window.scrollTo(0,from+(to-from)*ease(t));if(t<1)scrollFrame=requestAnimationFrame(tick);else done?.()})(start)}
 /* 선택창(알약 모양 탭) 공통 움직임: 고른 칸의 흰 바탕이 새 칸으로 미끄러진다.
    AiLabMotion.segments([{box:'.tabs', on:'.tab.active'}, ...]) 로 등록하면, 다시 그려져도(innerHTML) 직전 위치에서 이어서 움직인다. */
 const groups=[],last=new Map();let segFrame=0;
 function place(box,key,on){let mark=box.querySelector(':scope>.ailab-seg-mark');const fresh=!mark;if(fresh){mark=document.createElement('span');mark.className='ailab-seg-mark';mark.setAttribute('aria-hidden','true');box.prepend(mark);box.classList.add('ailab-seg')}
  box.querySelectorAll(':scope>.ailab-seg-on').forEach(el=>{if(el!==on)el.classList.remove('ailab-seg-on')});if(!on||!on.offsetWidth){mark.style.opacity='0';return}on.classList.add('ailab-seg-on');
  const style=getComputedStyle(on),to={x:on.offsetLeft,y:on.offsetTop,w:on.offsetWidth,h:on.offsetHeight},prev=fresh?last.get(key):null;mark.style.borderRadius=style.borderRadius;
  const set=v=>{mark.style.width=v.w+'px';mark.style.height=v.h+'px';mark.style.transform=`translate(${v.x}px,${v.y}px)`};
  if(fresh||mark.style.opacity==='0'){mark.style.transition='none';set(prev||to);mark.style.opacity='1';mark.getBoundingClientRect();mark.style.transition=''}
  set(to);last.set(key,to)}
 function scanSegments(){segFrame=0;groups.forEach((g,gi)=>document.querySelectorAll(g.box).forEach((box,i)=>place(box,gi+':'+i,box.querySelector(g.on))))}
 const queue=()=>{if(!segFrame)segFrame=requestAnimationFrame(scanSegments)};
 let watching=false;
 function segments(list){groups.push(...list);queue();if(watching)return;watching=true;const sel=()=>groups.map(g=>g.box).join(',');
  new MutationObserver(records=>{const s=sel();if(records.some(r=>{const n=r.target.nodeType===1?r.target:r.target.parentElement;/* 화면(페이지)이 보이거나 숨겨질 때도 다시 잰다 */if(r.attributeName==='hidden')return true;return n?.closest?.(s)||[...(r.addedNodes||[])].some(a=>a.nodeType===1&&(a.matches?.(s)||a.querySelector?.(s)))}))queue()}).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['class','aria-pressed','aria-selected','hidden']});
  addEventListener('resize',queue)}
 window.AiLabMotion=Object.freeze({timing,reduced,ease,scrollTo,segments});
})();

/* 공통 팝업 닫기(×): 열린 <dialog>에 '닫기'·'취소' 버튼이 있으면 오른쪽 위(스크롤해도 고정)에 ×를 두고 누르면 그 버튼을 대신 누른다.
   창을 닫는 버튼('닫기' 전부, '닫기'가 없을 때 창을 닫는 '취소')은 숨겨 ×만 남긴다. 수정 취소처럼 창을 닫지 않는 '취소'(다른 닫기 버튼이 따로 있는 경우)는 그대로 둔다.
   버튼마다의 닫기 처리(저장 중 막기 등)는 원래 버튼이 그대로 한다. */
(()=>{
 if(typeof document==='undefined')return;
 const label=b=>b.textContent.trim();
 const closer=d=>{const all=[...d.querySelectorAll('button')].filter(b=>!b.classList.contains('ailab-dialog-x')&&(!b.hidden||'ailabHiddenClose' in b.dataset)&&!b.disabled);return all.find(b=>label(b)==='닫기'||b.id==='closeModal')||all.find(b=>label(b)==='취소')};
 function fit(d){

 /* 빨간 선을 끄는 동안은 화면이 스크롤되지 않게 */
 document.addEventListener('touchmove',e=>{if(document.querySelector('.run-now-line.is-drag'))e.preventDefault()},{passive:false});
 if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js')})();
</script></body></html>
